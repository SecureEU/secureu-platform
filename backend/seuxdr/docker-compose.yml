version: '3.9'

services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: seuxdr-manager
    platform: linux/amd64
    hostname: Mac.home
    privileged: true  # Required for systemd to work properly
    ports:
      - "8443:8443"
      - "8081:8081"
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - ./manager/certs:/seuxdr/manager/certs
      # SEUXDR Go-server state (SQLite DB + log queue).
      # Wazuh state (/var/ossec, /etc/wazuh-*, /var/lib/wazuh-*) is
      # intentionally NOT volumed. wazuh-install.sh pre-flight-checks for
      # those directories' existence and treats them as "already installed"
      # even when empty (a directory created by a fresh empty named volume
      # is enough to abort the install). For state persistence across
      # restarts we instead rely on the container itself surviving
      # `systemctl restart` and host reboots: start.sh uses `compose up -d`
      # (no --build), and startup.sh skips wazuh-install.sh when the
      # /var/ossec/.wazuh-installed marker is present from a prior install.
      # Explicit container recreate (docker compose down) is a rebuild
      # event by definition and pays the ~10-minute Wazuh install cost.
      - seuxdr-storage:/seuxdr/manager/storage
      - seuxdr-queue:/var/seuxdr/manager/queue

volumes:
  seuxdr-storage:
  seuxdr-queue:
