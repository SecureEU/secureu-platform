version: '3.9'

services:
  manager:
    build:
      context: .
      dockerfile: Dockerfile
      platforms:
        - linux/amd64
    container_name: seuxdr-manager
    platform: linux/amd64
    hostname: Mac.home
    privileged: true  # Required for systemd to work properly
    ports:
      - "8443:8443"
      - "8081:8081"
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - ./manager/certs:/seuxdr/manager/certs
      # SEUXDR Go-server state (SQLite DB + log queue).
      - seuxdr-storage:/seuxdr/manager/storage
      - seuxdr-queue:/var/seuxdr/manager/queue
      # Persist Wazuh state across container recreate. Combined with the
      # marker-file check in startup.sh (skips wazuh-install.sh if already
      # installed), restarts take ~30s instead of ~10 min and no longer hit
      # the flaky reinstall path. The .wazuh-installed marker lives at
      # /var/ossec/, on the wazuh-ossec volume.
      - wazuh-ossec:/var/ossec
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - wazuh-indexer-conf:/etc/wazuh-indexer
      - wazuh-dashboard-data:/var/lib/wazuh-dashboard
      - wazuh-dashboard-conf:/etc/wazuh-dashboard
      - filebeat-data:/var/lib/filebeat
      - filebeat-conf:/etc/filebeat

volumes:
  seuxdr-storage:
  seuxdr-queue:
  wazuh-ossec:
  wazuh-indexer-data:
  wazuh-indexer-conf:
  wazuh-dashboard-data:
  wazuh-dashboard-conf:
  filebeat-data:
  filebeat-conf:
